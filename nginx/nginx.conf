# Edge nginx config for the production deploy.
# Mounted into the `nginx` container at /etc/nginx/conf.d/default.conf.
#
# Two server blocks:
#   :80   — serves the ACME HTTP-01 challenge for Let's Encrypt and
#           redirects all other traffic to HTTPS.
#   :443  — terminates TLS with the certbot-issued certificate and
#           reverse-proxies to the internal services.

# HTTP — Let's Encrypt challenge + redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev.praxis-form.de;

    # Webroot used by certbot --webroot for the HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination + reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.praxis-form.de;

    ssl_certificate     /etc/letsencrypt/live/dev.praxis-form.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.praxis-form.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Use Docker's embedded DNS (127.0.0.11) and re-resolve every 30s.
    # Combined with the variable-based `proxy_pass` below, this means
    # upstream IPs are looked up on every request rather than cached at
    # nginx startup — so when a backend container is recreated by a deploy
    # and gets a new internal IP, nginx picks it up without a restart.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Auth API.
    location /api/auth/ {
        set $auth_upstream "auth-service:8080";
        proxy_pass http://$auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clinical API.
    location /api/clinical/ {
        set $clinical_upstream "clinical-service:8081";
        proxy_pass http://$clinical_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA — catch-all.
    location / {
        set $frontend_upstream "frontend:80";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
