services:
  mariadb-auth:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb-clinic:
    image: mariadb:11
    restart: unless-stopped
    container_name: clinic-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: clinicdb
      MARIADB_INITDB_SKIP_TZINFO: 1
    ports:
      - "3307:3307"
    volumes:
      - mariadb_clinic_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://mariadb-auth:3306/auth_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mariadb-auth:
        condition: service_healthy

  clinical-service:
    build: ./clinical-service
    restart: unless-stopped
    container_name: clinic-clinical-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-clinic:3306/clinicdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
    depends_on:
      mariadb-clinic:
        condition: service_healthy
    networks:
      - clinic-network
      - default

networks:
  clinic-network:
    driver: bridge

volumes:
  mariadb_data:
  mariadb_clinic_data:
