spring.application.name=clinical-service

# MariaDB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/clinicdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081

# JWT Configuration (must match auth-service: Base64-encoded HMAC secret, 24h expiry)
jwt.secret=VGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBKV1Qgc2lnbmluZyE=
jwt.expiration=86400000
